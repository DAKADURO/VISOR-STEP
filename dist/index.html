<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor STEP 3D Premium</title>
    <!-- Usamos Google Fonts para una tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-C-Pnfj3-.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CkVcZT4u.css">
  </head>
  <body>
    <div id="app">
      <!-- El canvas 3D ocupará toda la pantalla -->
      <canvas id="webgl-canvas"></canvas>

      <!-- Interfaz superpuesta (Glassmorphism) -->
      <div id="ui-layer">
        <header class="glass-panel">
          <h1>Visor STEP</h1>
          <p>Haz clic en <strong>Abrir Archivo</strong> o arrastra tu archivo <strong>.step</strong> / <strong>.stp</strong> a la ventana.</p>
          <!-- Botón principal para seleccionar archivo -->
          <button id="btn-open-file" class="glass-btn primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:8px">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Abrir Archivo
          </button>
          <!-- Input de archivo oculto (acepta .step y .stp) -->
          <input type="file" id="file-input" accept=".step,.stp" style="display:none" />
          <div class="controls tools-grid">
            <button id="btn-wireframe" class="glass-btn">Ver Bordes</button>
            <button id="btn-reset" class="glass-btn">Reiniciar</button>
            <button id="btn-measure" class="glass-btn" title="Medir distancias">📐 Medir</button>
            <button id="btn-screenshot" class="glass-btn" title="Tomar foto">📸 Foto</button>
          </div>

          <!-- Selectores de color -->
          <div class="color-controls hidden" id="color-controls">
            <div class="color-item">
              <label for="color-bg">Fondo:</label>
              <input type="color" id="color-bg" value="#0d1117">
            </div>
            <div class="color-item disabled" id="part-color-container">
              <label for="color-part">Pieza:</label>
              <input type="color" id="color-part" value="#b0c4de" disabled>
            </div>
          </div>
          
          <!-- Panel de Medición -->
          <div id="measure-panel" class="hidden">
            <p><strong>Distancia:</strong> <span id="measure-result">--</span> mm</p>
            <p class="small-text">Haz clic en dos puntos del modelo.</p>
          </div>
        </header>
        
        <!-- Indicador de carga -->
        <div id="loading-overlay" class="hidden">
          <div class="spinner"></div>
          <p id="loading-text">Cargando modelo...</p>
        </div>
      </div>
      
      <!-- Zona de Drag & Drop (invisible hasta que se arrastre algo) -->
      <div id="drop-zone" class="hidden">
        <div class="drop-message">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <h2>Suelta el archivo para cargarlo</h2>
        </div>
      </div>
    </div>
    
  </body>
</html>
