<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor STEP 3D Premium</title>
    <!-- Usamos Google Fonts para una tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- El canvas 3D ocupará toda la pantalla -->
      <canvas id="webgl-canvas"></canvas>

      <!-- Interfaz superpuesta (Glassmorphism) -->
      <div id="ui-layer">
        <header class="glass-panel">
          <h1>Visor STEP</h1>
          <p>Arrastra y suelta tu archivo <strong>.step</strong> o <strong>.stp</strong> aquí.</p>
          <div class="controls">
            <button id="btn-wireframe" class="glass-btn">Ver Bordes</button>
            <button id="btn-reset" class="glass-btn">Reiniciar Cámara</button>
          </div>
        </header>
        
        <!-- Indicador de carga -->
        <div id="loading-overlay" class="hidden">
          <div class="spinner"></div>
          <p id="loading-text">Cargando modelo...</p>
        </div>
      </div>
      
      <!-- Zona de Drag & Drop (invisible hasta que se arrastre algo) -->
      <div id="drop-zone" class="hidden">
        <div class="drop-message">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <h2>Suelta el archivo para cargarlo</h2>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
